<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 개인 홈페이지</title>
    <style>
        /* 간단한 디자인(CSS) */
        body {
            font-family: 'Arial', sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
        }
        h1 { color: #333; }
        p { color: #666; }
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s;
        }
        .btn:hover { background-color: #0056b3; }
    </style>
</head>
<body>

    <div class="container">
        <h1>👋 반가워요!</h1>
        <p>GitHub Codespaces를 통해 만든<br>저의 첫 번째 홈페이지입니다.</p>
        <p>앞으로 이곳에 제 작업물들을 채워나갈 예정이에요.</p>
        <a href="https://github.com/jjnhyx1" class="btn">내 깃허브 구경가기</a>
    </div>

</body>
</html>
